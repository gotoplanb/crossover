<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Crossover{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script>
    // HTMX requests carry no form body, so the CSRF token rides as a header.
    // Attached globally rather than per-element, so a new hx-post cannot forget
    // it — the same reason the server check hangs off the router.
    document.addEventListener("htmx:configRequest", (event) => {
      event.detail.headers["X-CSRF-Token"] = "{{ csrf_token(request) }}";
    });
  </script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <style>
    [x-cloak] { display: none !important; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased">
  {% if request.cookies.get('crossover_user') %}
  <nav class="border-b border-zinc-800 bg-zinc-900/60 sticky top-0 backdrop-blur z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/ui/rack" class="text-lg font-semibold tracking-tight">Crossover</a>
        <a href="/ui/rack" class="text-sm text-zinc-400 hover:text-zinc-100">The rack</a>
        <a href="/ui/events" class="text-sm text-zinc-400 hover:text-zinc-100">Events</a>
      </div>
      <form action="/ui/logout" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <button class="text-sm text-zinc-400 hover:text-zinc-100">Sign out</button>
      </form>
    </div>
  </nav>
  {% endif %}
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-6xl mx-auto px-4 py-8 mt-8 border-t border-zinc-800">
    {# Marvel's terms require this wherever their data or art is displayed. #}
    <p class="text-xs text-zinc-500">{{ attribution() }}</p>
  </footer>
</body>
</html>
