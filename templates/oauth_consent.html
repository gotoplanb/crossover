{% extends "base.html" %}
{% block title %}Authorize — Crossover{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-xl font-semibold">Connect {{ client_name }}?</h1>
  <p class="mt-3 text-sm text-zinc-400">
    It will read and write the reading list belonging to
    <span class="text-zinc-200">{{ user_email }}</span>, with scope
    <code class="text-zinc-300">{{ scope }}</code>.
  </p>
  <form method="post" action="/oauth/authorize" class="mt-6 flex gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    {% for name, value in fields.items() %}
    <input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}
    <button name="decision" value="approve"
            class="bg-zinc-100 text-zinc-900 rounded px-4 py-2 text-sm font-medium">Approve</button>
    <button name="decision" value="deny"
            class="border border-zinc-700 text-zinc-300 rounded px-4 py-2 text-sm">Deny</button>
  </form>
</div>
{% endblock %}
