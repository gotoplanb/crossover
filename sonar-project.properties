# SonarQube config for Crossover. Scan with `make sonar-scan`.
#
# The host URL and token are passed at scan time from the environment, never
# committed here — this repo is public. `make sonar-scan` reads SONAR_TOKEN from
# .env (gitignored) or the ambient environment.

sonar.projectKey=crossover
sonar.projectName=Crossover
sonar.projectVersion=0.1.0

# `sonar.sources` and `sonar.tests` must be disjoint — `sonar.sources=.` plus
# `sonar.tests=tests` makes Sonar refuse to index the test files twice. Source
# roots are therefore enumerated, which keeps test code analyzed under
# test-specific rules (asserts are fine there, some smells don't apply) instead
# of excluding it from analysis altogether.
#
# The risk of an explicit list is that a NEW top-level module silently escapes
# analysis. `tests/unit/test_sonar_config.py` fails if this list drifts from
# what is on disk, so that cannot happen quietly.
sonar.sources=\
  auth.py,\
  csrf.py,\
  lifespan.py,\
  main.py,\
  mcp_server.py,\
  oauth_provider.py,\
  templates_env.py,\
  config,\
  curation,\
  db,\
  marvel,\
  models,\
  observability,\
  routes,\
  scripts,\
  service
sonar.tests=tests

# Exclusions — not analyzed at all:
#  - vendored / generated / cache directories
#  - alembic/versions: autogenerated migrations; the rules don't apply cleanly
#    and reformatting them would obscure the diff against what alembic emitted
#  - templates: Jinja, not Python; Sonar's HTML rules produce noise on them
#  - .claude/: Claude Code's per-machine state, not project source
sonar.exclusions=\
  .venv/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  .pytest_cache/**,\
  .ruff_cache/**,\
  .mypy_cache/**,\
  .scannerwork/**,\
  .claude/**,\
  alembic/versions/**,\
  templates/**,\
  htmlcov/**,\
  build/**,\
  dist/**,\
  *.egg-info/**,\
  .env,\
  .env.*,\
  .coverage,\
  coverage.xml,\
  **/.DS_Store

# Repetitive fixture setup across test modules is fine and not duplication
# worth reporting.
sonar.cpd.exclusions=tests/**

# Coverage-only exclusions. Sonar still runs static analysis on these (smells
# and security issues are still caught) — they are just left out of the coverage
# metric. Kept in sync with `omit` in pyproject.toml's [tool.coverage.run]:
#  - scripts/**: operator CLI. Its value is in being run by a human against a
#    real Marvel key, which is exactly what a unit test cannot do.
#  - main.py / lifespan.py: process bootstrap. Exercised by every route test
#    booting the app, but the lines themselves are wiring.
#  - alembic/**: migration harness.
sonar.coverage.exclusions=\
  scripts/**,\
  main.py,\
  lifespan.py,\
  alembic/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# pytest-cov writes Cobertura XML here; that is the format Sonar reads for Python.
sonar.python.coverage.reportPaths=coverage.xml

# Disable SCM blame collection. The scanner-in-Docker stalls indefinitely on the
# SCM Publisher step against Docker-Desktop bind mounts on macOS (a file
# timestamp quirk). Costs author/blame info in the UI; issues, smells, security
# hotspots and coverage all still work.
sonar.scm.disabled=true
