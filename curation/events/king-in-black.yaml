# King in Black (2020-2021) — curated reading order and reference graph.
#
# THIS FILE IS THE SOURCE OF TRUTH for order, roles, clustering, and the
# reference edges. A Marvel refetch can never overwrite it (see marvel/sync.py);
# it only ever fills in API-derived fields on the issue records.
#
# ── Provenance and confidence ────────────────────────────────────────────────
# Seeded by hand. SPEC §5 wants Marvel's own reading guide as the seed, but
# marvel.com returns 403 to programmatic requests (docs/gates.md), and no
# Marvel API key was available, so neither source could be consulted. Every
# entry is therefore `provisional: true` and the event is `best_effort`:
#
#   * The roster and the ordering are a defensible starting point, not a
#     verified one. Publication dates especially are approximate.
#   * NO issue carries a digital_id. Per Gate B a guessed id does not error —
#     it silently opens a different comic — so every issue renders as
#     "not on Marvel Unlimited" until a real sync confirms one.
#
# To promote this file to `curated`:
#   1. make check-api-key                     (confirm credentials work at all)
#   2. make sync-event slug=king-in-black     (fills digital ids from the API)
#   3. reconcile the roster against marvel.com/comics/guides/2075/king-in-black
#   4. drop `provisional: true`, set curation_status: curated
#   5. make test  — the §8 gates get strict at that point and will say what is
#      still missing
#
# ── The part that is genuinely ours ──────────────────────────────────────────
# `references:` at the bottom is the omnibus-footnote citation graph. It cannot
# come from any API; it is the reason this project exists. The notes are written
# to be read aloud as provenance on the rack ("this scene is expanded in X").
# `omnibus_page` is left null throughout — those numbers have to be read off the
# physical book, and inventing them would defeat the purpose.

slug: king-in-black
display_name: King in Black
curation_status: best_effort

# The numeric id for gateway.marvel.com/v1/public/events/{id}/comics. Unset
# because it was never confirmed against a live API response, and a wrong event
# id would sync an entirely wrong roster. Fill it from `make list-events`.
marvel_event_id: null

started_on: 2020-12-02
ended_on: 2021-05-12

summary: >
  Knull, the god of the symbiotes, arrives at Earth with a living army and puts
  the planet under a darkness. The core line is five issues; almost everything
  worth reading around it is a tie-in, which is the problem this guide exists
  to solve.

# The spine of the event. Declared explicitly so the "every core issue is
# present and ordered" gate is a real check rather than a tautology over
# whatever happens to be in the file below.
core:
  series: King in Black
  count: 5

