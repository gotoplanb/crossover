# The omnibus-footnote layer. Direction is always "from the issue you just
# finished, to the issue that expands on it" — which is exactly the question
# whats_next() answers.
references:
  - from: web-of-venom-empyre-s-end-1
    to: king-in-black-1
    type: prelude_to
    note: "Knull's approach is set up here; KiB #1 opens with him already arriving."
    omnibus_page: null

  - from: king-in-black-1
    to: king-in-black-immortal-hulk-1
    type: expanded_in
    note: "The Hulk is off-panel for the blackout in the core issue; this one-shot is where that fight actually happens."
    omnibus_page: null

  - from: king-in-black-1
    to: venom-31
    type: continues_in
    note: "Eddie and Dylan's side of the invasion picks up directly out of the core issue."
    omnibus_page: null

  - from: king-in-black-2
    to: king-in-black-namor-1
    type: flashback_in
    note: "Namor recognises the god. The thousand-years-ago encounter he is remembering is the whole Namor miniseries."
    omnibus_page: null

  - from: king-in-black-2
    to: king-in-black-thunderbolts-1
    type: parallel_to
    note: "Street level in the same city, same nights."
    omnibus_page: null

  - from: king-in-black-3
    to: king-in-black-planet-of-the-symbiotes-1
    type: expanded_in
    note: "The invasion is global in one line of dialogue here; the anthology is what that line looks like."
    omnibus_page: null

  - from: king-in-black-3
    to: king-in-black-gwenom-vs-carnage-1
    type: parallel_to
    note: "Gwen's thread, referenced but not shown."
    omnibus_page: null

  - from: king-in-black-3
    to: king-in-black-return-of-the-valkyries-1
    type: expanded_in
    note: "Jane Foster's search for the Valkyries, which the core book skips to the result of."
    omnibus_page: null

  - from: king-in-black-4
    to: king-in-black-iron-man-doom-1
    type: expanded_in
    note: "The tech solution arrives fully formed in the core issue. This is where it gets built."
    omnibus_page: null

  - from: king-in-black-4
    to: king-in-black-black-knight-1
    type: parallel_to
    omnibus_page: null

  - from: king-in-black-4
    to: king-in-black-marauders-1
    type: parallel_to
    note: "The mutant response, which the core line never touches."
    omnibus_page: null

  - from: king-in-black-5
    to: venom-34
    type: epilogue_in
    note: "The core finale resolves the fight; this resolves Eddie."
    omnibus_page: null

  - from: king-in-black-5
    to: king-in-black-return-of-the-valkyries-4
    type: epilogue_in
    omnibus_page: null

  - from: king-in-black-5
    to: king-in-black-namor-5
    type: epilogue_in
    note: "Namor's account closes out after the core book ends."
    omnibus_page: null

  - from: king-in-black-5
    to: king-in-black-ghost-rider-1
    type: references
    omnibus_page: null

