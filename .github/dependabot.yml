# Dependency updates. Weekly rather than daily: this is a two-person project and
# a pull request per dependency per day would train everyone to ignore them.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the whole OpenTelemetry family — they release in
      # lockstep and are meaningless to review individually.
      opentelemetry:
        patterns:
          - "opentelemetry-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
