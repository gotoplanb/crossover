# Mirrors scripts/hooks/pre-push. Until this existed, the only thing enforcing
# quality was a *local* git hook: a contributor's pull request was checked by
# nothing, and `--no-verify` bypassed everything silently.
#
# Split into two jobs on purpose. `checks` needs no database and finishes in
# seconds, so a lint slip or a committed secret fails fast instead of waiting
# behind Postgres starting up.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, secrets, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked, so CI fails if uv.lock drifts from pyproject.toml rather
        # than silently resolving something different from what deploys.
        run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Secret scan
        run: uv run python scripts/check_secrets.py

      - name: Unit tests
        # No database at all — the curation gates, link rules, record parsing
        # and clustering are pure, which is what lets them run this early.
        run: uv run pytest tests/unit -q

  test:
    name: full suite + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossover
          POSTGRES_DB: crossover
          # Matches docker-compose: loopback-only in CI too, and it means no
          # password lives in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossover"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite forks this to `crossover_test` itself and creates it on
      # first run, so nothing here has to pre-provision a database.
      DATABASE_URL: postgresql+asyncpg://crossover@localhost:5432/crossover
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Tests with coverage
        # `fail_under` lives in pyproject.toml, so the floor is enforced here
        # without being restated — one place to change it.
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  sonar:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    needs: test
    # The local Watchtower SonarQube is not reachable from a GitHub runner, so
    # this runs only once a hosted instance is configured. Skipped rather than
    # failed while the secrets are absent: a missing optional integration should
    # not turn every pull request red. See issue #11 for the SonarCloud decision.
    if: >-
      github.event_name == 'push' &&
      vars.SONAR_HOST_URL != ''
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar wants full history to attribute new code to the right commits.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked --all-groups

      - name: Coverage for Sonar
        env:
          DATABASE_URL: postgresql+asyncpg://crossover@localhost:5432/crossover
          OTEL_ENABLED: "false"
        # Unit tests only: this job has no Postgres service, and Sonar needs a
        # coverage report rather than a complete one to attribute new lines.
        run: uv run pytest tests/unit -q --cov --cov-report=xml || true

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  deploy:
    name: deploy to Heroku
    runs-on: ubuntu-latest
    # Both gates, not just the fast one: a deploy that skipped the database
    # suite would be a deploy that skipped every migration test.
    needs: [checks, test]
    # Skipped rather than failed while unconfigured, like `sonar` above — a
    # fork or a repo without the credential should not go red. Gated on the
    # *variable* because `secrets` cannot be referenced in a job-level `if`.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.HEROKU_APP_NAME != ''
    concurrency:
      # Deploys queue instead of racing. The workflow-level group cancels
      # superseded *runs*, which is right — a newer commit should win — but two
      # deploys pushing at once is never right.
      group: deploy-heroku
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.HEROKU_APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Heroku's git receive rejects a shallow push, and checkout defaults
          # to depth 1.
          fetch-depth: 0

      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        # Not --force. If Heroku's history has diverged from ours something
        # happened that a deploy should not paper over.
        run: |
          git push "https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git" \
            HEAD:refs/heads/main

      - name: Wait for the release to succeed
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        # The push above succeeding does NOT mean the deploy went live. The
        # Procfile declares `release: alembic upgrade head`, and Heroku says so
        # itself: "this new release will not be available until the command
        # succeeds." Without this step CI would report green on a failed
        # migration, which is the exact failure a deploy gate exists to catch.
        run: |
          api() {
            curl -sf \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              "https://api.heroku.com/apps/$HEROKU_APP_NAME/$1"
          }
          for _ in $(seq 1 60); do
            read -r release_version release_status \
              <<<"$(api releases | jq -r '.[-1] | "\(.version) \(.status)"')"
            case "$release_status" in
              succeeded) echo "release v$release_version succeeded"; exit 0 ;;
              failed)
                echo "::error::release v$release_version failed — see the release log"
                api "releases/$release_version" | jq -r '.output_stream_url // empty' \
                  | xargs -r curl -s | tail -40
                exit 1 ;;
              *) echo "release v$release_version: $release_status"; sleep 5 ;;
            esac
          done
          echo "::error::release did not settle in 5 minutes"
          exit 1

      - name: Smoke check
        env:
          HEROKU_APP_URL: ${{ vars.HEROKU_APP_URL }}
        # A released dyno that cannot answer /healthz is not a deploy that
        # worked, whatever the release status says.
        run: |
          url="${HEROKU_APP_URL:-}"
          if [ -z "$url" ]; then echo "HEROKU_APP_URL unset — skipping"; exit 0; fi
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${url%/}/healthz" || true)
            [ "$code" = "200" ] && { echo "healthz 200"; exit 0; }
            echo "healthz $code — retrying"; sleep 5
          done
          echo "::error::/healthz never returned 200 after the release"
          exit 1
